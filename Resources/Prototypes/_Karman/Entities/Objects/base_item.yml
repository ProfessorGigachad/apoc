#for non weapons
- type: entity
  parent: BaseItemDamageless
  id: BaseItem
  components:
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 0.3
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0.3

#base prototype for weapon throw damages, exists so you could alter all weapon throwing damage prototypes at once
- type: entity
  parent: BaseItem
  id: BaseItemThrowableWeapon #Dont use me directly
  components:
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 1

