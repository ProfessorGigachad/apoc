# # # Special bases # # #
#energy melee weapons
- type: entity
  parent: BaseItemThrowableWeapon
  id: BaseItemThrowableEnergyWeapon
  components:
  - type: ComponentToggler
    components:
    - type: Tool
      qualities:
      - Slicing
    - type: DisarmMalus
      malus: 0.6
    - type: Execution
      doAfterDuration: 4.0
    - type: DamageOtherOnHit
      damage:
        types:
          Heat: 8
